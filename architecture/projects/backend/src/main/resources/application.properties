spring.application.name=canchaya-backend

# Puerto: Render lo entrega en la variable PORT; en local se usa el 8080.
server.port=${PORT:8080}

# --- Base de datos -----------------------------------------------------------
# Los valores por defecto son los del docker-compose.yml local.
# En Render se definen como variables secretas (RT-10, D35).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/canchaya}
spring.datasource.username=${DB_USUARIO:canchaya}
spring.datasource.password=${DB_CLAVE:canchaya}
# Máximo 5 conexiones para no agotar el plan gratuito de Supabase (táctica AC-05.3).
spring.datasource.hikari.maximum-pool-size=5

# Flyway crea y cambia las tablas al arrancar (RT-04); JPA solo revisa que coincidan.
spring.jpa.hibernate.ddl-auto=validate
# Cada petición abre y cierra su propia transacción; no se dejan consultas pendientes en la vista.
spring.jpa.open-in-view=false
# Todas las fechas y horas en America/Bogota (D27, PAR-GEN-01).
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

# --- Verificación de estado (AC-02.3) ------------------------------------------
# Render y UptimeRobot consultan /actuator/health. Solo se publica ese punto.
management.endpoints.web.exposure.include=health
