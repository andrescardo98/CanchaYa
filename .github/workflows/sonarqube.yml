# Análisis de calidad con SonarQube Cloud: corre las pruebas del backend y del frontend con
# cobertura y envía el resultado a Sonar en cada pull request y en cada cambio a main.
# La configuración del análisis está en sonar-project.properties, en la raíz del repositorio.
name: SonarQube

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  analizar:
    name: Compilar, probar y analizar
    # Ubuntu y no Windows: las pruebas de base de datos usan Testcontainers, que necesita Docker de Linux.
    runs-on: ubuntu-latest
    env:
      NG_CLI_ANALYTICS: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Sonar necesita el historial completo para saber qué código es nuevo

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify corre las pruebas y JaCoCo deja la cobertura en target/site/jacoco/jacoco.xml
      - name: Probar el backend con cobertura
        working-directory: projects/api
        run: ./mvnw -B verify

      - name: Instalar Node.js 24 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: projects/web/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: projects/web
        # --ignore-scripts: no corre los scripts de instalación de las dependencias (riesgo de seguridad)
        run: npm ci --ignore-scripts

      # Las rutas del reporte quedan relativas a projects/web; Sonar las necesita desde la raíz.
      - name: Probar el frontend con cobertura
        working-directory: projects/web
        run: |
          npm test -- --watch=false --coverage --coverage-reporters=lcov
          sed -i 's|^SF:|SF:projects/web/|' coverage/web/lcov.info

      - name: Guardar en caché los paquetes de Sonar
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Analizar con SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
