# Integración continua del backend: compila y corre todas las pruebas en cada pull request
# y en cada cambio a main. Si algo falla, el pull request queda en rojo y no se debe unir.
name: Backend

on:
  pull_request:
    paths:
      - "projects/api/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "projects/api/**"
      - ".github/workflows/backend.yml"

jobs:
  compilar-y-probar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/api
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # verify compila, corre las pruebas de arquitectura (ArchUnit) y las de base de datos
      # (Testcontainers usa el Docker que ya trae la máquina de GitHub).
      - name: Compilar y probar
        run: ./mvnw -B verify

      - name: Construir la imagen Docker
        run: docker build -t canchaya-backend .
