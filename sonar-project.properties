# Configuración del análisis de SonarQube Cloud. La usa .github/workflows/sonarqube.yml.
# Es un solo proyecto en Sonar con dos partes: el backend (Java) y el frontend (TypeScript).
sonar.organization=andrescardo98-1
sonar.projectKey=andrescardo98_CanchaYa
sonar.projectName=CanchaYa
sonar.sourceEncoding=UTF-8

# SonarQube Cloud analiza todo el repositorio (sonar.sources y sonar.tests ya no tienen efecto)
# y reconoce las pruebas por su ruta (src/test, *.spec.ts). Aquí solo se excluye lo que no es código.
sonar.exclusions=docs/**,.claude/**,**/*.png,**/*.ico

# Backend: clases compiladas por ./mvnw verify y reporte de cobertura de JaCoCo
sonar.java.binaries=projects/api/target/classes
sonar.java.test.binaries=projects/api/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=projects/api/target/site/jacoco/jacoco.xml

# Frontend: reporte de cobertura de Vitest (ng test --coverage)
sonar.javascript.lcov.reportPaths=projects/web/coverage/web/lcov.info
