# Textos del Catálogo de mensajes - CanchaYa.xlsx (AG-07). Solo están los que ya usa alguna HU.

# --- Generales ---------------------------------------------------------------
ERR-GEN-01=El campo {campo} es obligatorio.
ERR-GEN-02=El campo {campo} no tiene un formato válido. {formatoEsperado}
ERR-GEN-03=El campo {campo} debe tener entre {minimo} y {maximo} caracteres.
ERR-GEN-03.sin-minimo=El campo {campo} debe tener máximo {maximo} caracteres.
ERR-GEN-04=El valor de {campo} debe estar entre {minimo} y {maximo}.
ERR-GEN-05=Su sesión no está iniciada o venció. Inicie sesión para continuar.
ERR-GEN-07=Se presentó un problema inesperado. Intente de nuevo y, si el problema continúa, comuníquese con el administrador de la plataforma.

# --- Usuario -----------------------------------------------------------------
ERR-USU-01=Ya existe una cuenta registrada con este correo electrónico.
ERR-USU-02=Ya existe una cuenta registrada con este tipo y número de documento.
ERR-USU-03=El rol seleccionado no es válido. Elija Jugador o Administrador de cancha.
ERR-USU-06=El correo electrónico o la contraseña son incorrectos.
ERR-USU-07=El correo electrónico o la contraseña son incorrectos.
ERR-USU-08=No se encontró el usuario que se quiere modificar.
ERR-USU-09=No tiene permiso para modificar el perfil de otro usuario.
ERR-USU-10=Ya existe otra cuenta registrada con este correo electrónico.
ERR-USU-11=El tipo de documento, el número de documento y el rol no se pueden modificar.
ERR-USU-12=La contraseña debe tener mínimo 8 caracteres, con al menos una letra y un número.
ERR-USU-13=El número de documento no es válido para el tipo {tipoDocumento}: {formatoEsperado}.
ERR-USU-14=La tarjeta de identidad (TI) solo se admite para cuentas de jugador.
ERR-USU-15=Para registrarse con tarjeta de identidad debe declarar que cuenta con la autorización de su padre, madre o acudiente.
ERR-USU-16=Superó el número de intentos permitidos para iniciar sesión. Intente de nuevo en {minutos} minutos.
EXI-USU-01=Su cuenta se creó correctamente. Inicie sesión para continuar.
EXI-USU-02=Su perfil se actualizó correctamente.

# --- Escenario ---------------------------------------------------------------
ERR-ESC-01=Solo un administrador de cancha puede registrar escenarios.
ERR-ESC-02=La ciudad seleccionada no existe. Elija una ciudad de la lista.
ERR-ESC-03=La ubicación del escenario no es válida. Marque de nuevo el punto en el mapa.
ERR-ESC-13=Las fotos no cumplen las condiciones: {reglaIncumplida}. Se permiten máximo 5 fotos por escenario, en formato JPG o PNG y de hasta 2 MB cada una.
# Valores de {reglaIncumplida} en ERR-ESC-13
ERR-ESC-13.cantidad=se adjuntaron más de {maximo} fotos
ERR-ESC-13.formato=la foto {archivo} no es JPG ni PNG
ERR-ESC-13.tamano=la foto {archivo} pesa más de {maximo} MB
EXI-ESC-01=El escenario se registró correctamente. Será visible para los jugadores cuando el administrador del sistema lo active.

# --- Nombres de los campos como se ven en el formulario ({campo}) -------------
campo.nombre=nombre
campo.correoElectronico=correo electrónico
campo.contrasena=contraseña
campo.tipoDocumento=tipo de documento
campo.numeroDocumento=número de documento
campo.numeroCelular=número de celular
campo.rol=rol
campo.descripcion=descripción
campo.direccion=dirección
campo.ciudadId=ciudad
campo.latitud=latitud
campo.longitud=longitud
campo.telefonoContacto=teléfono de contacto
campo.correoContacto=correo de contacto

# --- Formato esperado de cada campo ({formatoEsperado} de ERR-GEN-02) ---------
formato.nombre=Solo se admiten letras y espacios.
formato.correoElectronico=Ejemplo: nombre@correo.com
formato.numeroCelular=Escriba el indicativo y el número, solo con dígitos. Ejemplo: +573001234567
formato.telefonoContacto=Escriba el indicativo y el número, solo con dígitos. Ejemplo: +573001234567
formato.correoContacto=Ejemplo: escenario@dominio.com
