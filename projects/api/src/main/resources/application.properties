spring.application.name=canchaya-backend

server.port=${PORT:8080}

# --- Base de datos -----------------------------------------------------------
# Valores por defecto del docker-compose.yml; en Render van como variables secretas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/canchaya}
spring.datasource.username=${DB_USUARIO:canchaya}
spring.datasource.password=${DB_CLAVE:canchaya}
# Límite de conexiones del plan gratuito de Supabase (AC-05.3)
spring.datasource.hikari.maximum-pool-size=5

# Las tablas las crea Flyway; JPA solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
# Supabase ya trae objetos en public (rls_auto_enable, D35); sin esto Flyway se niega a migrar.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Datos del administrador del sistema que carga la V2 (RN-16). Los valores por defecto son
# solo para desarrollo local (contraseña Admin12345); en Render se definen como secretos.
spring.flyway.placeholders.adminCorreo=${ADMIN_CORREO:admin@canchaya.local}
spring.flyway.placeholders.adminContrasenaHash=${ADMIN_CONTRASENA_HASH:$2a$10$K4c8RbDJhYpzOwJr7M5reOm7gidXLCIz0d6.zWknABxDWk0nIdxNq}
spring.flyway.placeholders.adminNumeroDocumento=${ADMIN_NUMERO_DOCUMENTO:1000000000}
spring.flyway.placeholders.adminNumeroCelular=${ADMIN_NUMERO_CELULAR:+573000000000}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

management.endpoints.web.exposure.include=health

# --- Seguridad (HU2) -----------------------------------------------------------
# Clave para firmar los tokens JWT: mínimo 32 caracteres. No tiene valor por defecto a propósito:
# si falta en Render, la aplicación no arranca, en vez de arrancar con una clave conocida.
# En local y en las pruebas la pone el pom.xml.
canchaya.jwt.secreto=${JWT_SECRETO}
# Render atiende la petición primero (proxy) y pasa la IP real del cliente en X-Forwarded-For.
# native: Tomcat la lee desde la derecha y salta las IP internas, así el cliente no la puede falsear.
server.forward-headers-strategy=native

# --- Parámetros del catálogo -------------------------------------------------
# PAR-USU-01
canchaya.usuario.longitud-minima-contrasena=${PAR_USU_01:8}
# PAR-USU-09: vigencia del token de acceso, en minutos (D37)
canchaya.usuario.vigencia-token-minutos=${PAR_USU_09:60}
# PAR-USU-10 a PAR-USU-12: límite de intentos de inicio de sesión (D28)
canchaya.usuario.intentos-fallidos-permitidos=${PAR_USU_10:5}
canchaya.usuario.minutos-ventana-intentos=${PAR_USU_11:5}
canchaya.usuario.minutos-bloqueo-inicio-sesion=${PAR_USU_12:15}
# PAR-ESC-01 a PAR-ESC-03: fotos de un escenario (D13)
canchaya.escenario.maximo-fotos=${PAR_ESC_01:5}
canchaya.escenario.tamano-maximo-foto-mb=${PAR_ESC_02:2}
canchaya.escenario.formatos-foto=${PAR_ESC_03:JPG,PNG}

# --- Fotos de los escenarios (D13, D31) ----------------------------------------
# local: carpeta del computador (solo desarrollo). supabase: Supabase Storage (Render).
canchaya.fotos.almacenamiento=${FOTOS_ALMACENAMIENTO:local}
canchaya.fotos.local.carpeta=${FOTOS_CARPETA_LOCAL:fotos-locales}
canchaya.fotos.local.url-base=${FOTOS_URL_BASE_LOCAL:http://localhost:${server.port}}
# Se exigen cuando el almacenamiento es supabase (van como secretos en Render)
canchaya.fotos.supabase.url=${SUPABASE_URL:}
canchaya.fotos.supabase.clave-servicio=${SUPABASE_CLAVE_SERVICIO:}
canchaya.fotos.supabase.bucket=${SUPABASE_BUCKET_FOTOS:}
# Límites técnicos del formulario con fotos: más altos que PAR-ESC-02 a propósito, para que
# una foto pesada llegue al caso de uso y el usuario reciba ERR-ESC-13 y no un error genérico.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB
