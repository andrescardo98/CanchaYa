spring.application.name=canchaya-backend

server.port=${PORT:8080}

# --- Base de datos -----------------------------------------------------------
# Valores por defecto del docker-compose.yml; en Render van como variables secretas.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/canchaya}
spring.datasource.username=${DB_USUARIO:canchaya}
spring.datasource.password=${DB_CLAVE:canchaya}
# Límite de conexiones del plan gratuito de Supabase (AC-05.3)
spring.datasource.hikari.maximum-pool-size=5

# Las tablas las crea Flyway; JPA solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
# Supabase ya trae objetos en public (rls_auto_enable, D35); sin esto Flyway se niega a migrar.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Datos del administrador del sistema que carga la V2 (RN-16). Los valores por defecto son
# solo para desarrollo local (contraseña Admin12345); en Render se definen como secretos.
spring.flyway.placeholders.adminCorreo=${ADMIN_CORREO:admin@canchaya.local}
spring.flyway.placeholders.adminContrasenaHash=${ADMIN_CONTRASENA_HASH:$2a$10$K4c8RbDJhYpzOwJr7M5reOm7gidXLCIz0d6.zWknABxDWk0nIdxNq}
spring.flyway.placeholders.adminNumeroDocumento=${ADMIN_NUMERO_DOCUMENTO:1000000000}
spring.flyway.placeholders.adminNumeroCelular=${ADMIN_NUMERO_CELULAR:+573000000000}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Bogota

management.endpoints.web.exposure.include=health
# El correo no cuenta para la salud de la aplicación: si Brevo falla, la aplicación sigue en pie (D15).
# Sin esto, /actuator/health diría DOWN, Render reiniciaría el contenedor y UptimeRobot avisaría.
management.health.mail.enabled=false

# --- Seguridad (HU2) -----------------------------------------------------------
# Clave para firmar los tokens JWT: mínimo 32 caracteres. No tiene valor por defecto a propósito:
# si falta en Render, la aplicación no arranca, en vez de arrancar con una clave conocida.
# En local y en las pruebas la pone el pom.xml.
canchaya.jwt.secreto=${JWT_SECRETO}
# Render atiende la petición primero (proxy) y pasa la IP real del cliente en X-Forwarded-For.
# native: Tomcat la lee desde la derecha y salta las IP internas, así el cliente no la puede falsear.
server.forward-headers-strategy=native

# --- Parámetros del catálogo -------------------------------------------------
# PAR-USU-01
canchaya.usuario.longitud-minima-contrasena=${PAR_USU_01:8}
# PAR-USU-09: vigencia del token de acceso, en minutos (D37)
canchaya.usuario.vigencia-token-minutos=${PAR_USU_09:60}
# PAR-USU-10 a PAR-USU-12: límite de intentos de inicio de sesión (D28)
canchaya.usuario.intentos-fallidos-permitidos=${PAR_USU_10:5}
canchaya.usuario.minutos-ventana-intentos=${PAR_USU_11:5}
canchaya.usuario.minutos-bloqueo-inicio-sesion=${PAR_USU_12:15}
# PAR-ESC-01 a PAR-ESC-03: fotos de un escenario (D13)
canchaya.escenario.maximo-fotos=${PAR_ESC_01:5}
canchaya.escenario.tamano-maximo-foto-mb=${PAR_ESC_02:2}
canchaya.escenario.formatos-foto=${PAR_ESC_03:JPG,PNG}
# PAR-ESC-04 a PAR-ESC-06: radio de la búsqueda de canchas, en km enteros (HU18, D11, D26)
canchaya.escenario.radio-busqueda-defecto-km=${PAR_ESC_04:5}
canchaya.escenario.radio-busqueda-maximo-km=${PAR_ESC_05:30}
canchaya.escenario.radio-busqueda-minimo-km=${PAR_ESC_06:1}
# PAR-RES-01: días hacia adelante en que se consulta y reserva; incluye hoy y hoy + 30 (RN-11)
canchaya.reserva.ventana-dias=${PAR_RES_01:30}
# PAR-RES-02 a PAR-RES-04: límites de una reserva y de un jugador (RN-08, D10)
canchaya.reserva.franjas-maximas=${PAR_RES_02:2}
canchaya.reserva.horas-maximas-dia=${PAR_RES_03:2}
canchaya.reserva.activas-maximas=${PAR_RES_04:5}
# PAR-RES-05: el jugador cancela si faltan más de estas horas (RN-10, D06)
canchaya.reserva.horas-minimas-cancelacion=${PAR_RES_05:3}
# PAR-RES-06 a PAR-RES-08: confirmación de asistencia (RN-13); la hora mínima va como HH:mm
canchaya.reserva.horas-anticipacion-confirmacion=${PAR_RES_06:5}
canchaya.reserva.hora-minima-confirmacion=${PAR_RES_07:12:00}
canchaya.reserva.horas-plazo-confirmacion=${PAR_RES_08:3}
# PAR-RES-09: horas después del fin para marcar una inasistencia (RN-09, D20)
canchaya.reserva.horas-plazo-inasistencia=${PAR_RES_09:24}
# PAR-RES-10: caracteres de la justificación de cancelación del propietario
canchaya.reserva.longitud-maxima-justificacion=${PAR_RES_10:250}
# PAR-RES-12: con false (No, D33) toda reserva nueva nace NO_REQUERIDA
canchaya.reserva.confirmacion-asistencia-activa=${PAR_RES_12:false}

# --- Fotos de los escenarios (D13, D31) ----------------------------------------
# local: carpeta del computador (solo desarrollo). supabase: Supabase Storage (Render).
canchaya.fotos.almacenamiento=${FOTOS_ALMACENAMIENTO:local}
canchaya.fotos.local.carpeta=${FOTOS_CARPETA_LOCAL:fotos-locales}
canchaya.fotos.local.url-base=${FOTOS_URL_BASE_LOCAL:http://localhost:${server.port}}
# Se exigen cuando el almacenamiento es supabase (van como secretos en Render)
canchaya.fotos.supabase.url=${SUPABASE_URL:}
canchaya.fotos.supabase.clave-servicio=${SUPABASE_CLAVE_SERVICIO:}
canchaya.fotos.supabase.bucket=${SUPABASE_BUCKET_FOTOS:}
# Límites técnicos del formulario con fotos: más altos que PAR-ESC-02 a propósito, para que
# una foto pesada llegue al caso de uso y el usuario reciba ERR-ESC-13 y no un error genérico.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=60MB

# --- Correo (RT-11, D15, D31) --------------------------------------------------
# Por defecto, Mailpit del docker-compose.yml (los correos se ven en http://localhost:8025).
# En Render: el SMTP relay de Brevo por el puerto 2525 con STARTTLS; usuario y clave van como secretos.
spring.mail.host=${CORREO_HOST:localhost}
spring.mail.port=${CORREO_PUERTO:1025}
spring.mail.username=${CORREO_USUARIO:}
spring.mail.password=${CORREO_CLAVE:}
spring.mail.properties.mail.smtp.auth=${CORREO_AUTENTICACION:false}
spring.mail.properties.mail.smtp.starttls.enable=${CORREO_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${CORREO_STARTTLS:false}
# Si el servidor de correo no responde, se desiste a los 5 segundos: la petición no se queda esperando
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
# Remitente de todos los correos. En Brevo debe ser un correo remitente verificado.
canchaya.correo.remitente=${CORREO_REMITENTE:CanchaYa <no-responder@canchaya.local>}
